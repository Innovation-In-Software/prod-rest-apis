The same four-line parameter block appears twice—once under get, once under delete. On a real API with a dozen endpoints that take an item ID, you'd repeat it a dozen times, and changing the type from integer to string would mean editing every copy and hoping you didn't miss one. That repetition is exactly what the components/parameters version eliminates.