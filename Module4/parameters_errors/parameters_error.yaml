openapi: 3.1.0
info:
  title: Items API
  version: 1.0.0

paths:
  /items:
    get:
      summary: List items
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: in_stock
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: A list of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'

  /items/{id}:
    get:
      summary: Get one item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: No item with that ID exists
        '422':
          description: Validation error (e.g., id was not an integer)

components:
  schemas:
    Item:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        price:
          type: number
        in_stock:
          type: boolean
          default: true