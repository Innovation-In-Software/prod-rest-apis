requestBody:
  # must send a body
  required: true                    
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Item'

components:
  schemas:
    Item:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
      required:                     # body must contain these
        - name
        - price